#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  # SSOwat runs in the access phase and replaces Authorization with Basic auth.
  # "set" runs earlier, so this keeps the Bearer token sent by the client.
  set $client_authorization $http_authorization;
  proxy_set_header  Authorization $client_authorization;

  # SSOwat provides these for logged-in users and strips client-sent copies
  proxy_set_header  Ynh-User $http_ynh_user;
  proxy_set_header  Ynh-User-Email $http_ynh_user_email;

  proxy_pass        http://127.0.0.1:__PORT__/;
  proxy_redirect    off;
  proxy_set_header  Host $host;
  proxy_set_header  X-Real-IP $remote_addr;
  proxy_set_header  X-Forwarded-Proto $scheme;
  proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header  X-Forwarded-Host $server_name;

  proxy_http_version 1.1;
  proxy_set_header Connection "upgrade";
  proxy_set_header Upgrade $http_upgrade;
}
